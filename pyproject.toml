[project]
name = "sniffmcp"
version = "0.4.0"
description = "Audit the MCP servers installed in your agent: injection, credentials, pinning, and post-install drift."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "security", "scanner", "ai-agents", "supply-chain", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
bench = ["yara-python>=4.5"]   # scripts/benchmark_yara.py only; never a runtime dependency

[project.urls]
Homepage = "https://github.com/SomehowLiving/sniffmcp"
Issues = "https://github.com/SomehowLiving/sniffmcp/issues"
Changelog = "https://github.com/SomehowLiving/sniffmcp/blob/main/CHANGELOG.md"

[project.scripts]
sniffmcp = "sniffmcp.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sniffmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
