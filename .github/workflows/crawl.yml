name: crawl

# Daily ecosystem crawl on GitHub's runners, independent of any laptop.
# The database lives in the PRIVATE repo SomehowLiving/sniffmcp-data as release assets
# (crawl.db.zst + report.md, last 14 kept). This repo is public, so logs carry counts only:
# `--quiet` never prints server names or URLs, and the report is uploaded, never printed.
# A failed scheduled run emails the repo owner (GitHub Actions notifications).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Smoke test: probe/check at most N items (empty = full crawl)"
        required: false
        default: ""
      full_sync:
        description: "Re-read the whole registry instead of only recent changes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATA_REPO: SomehowLiving/sniffmcp-data
      GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      IN_LIMIT: ${{ inputs.limit }}
      IN_FULL_SYNC: ${{ inputs.full_sync }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e .

      - name: Fetch latest database (private repo)
        id: fetch
        run: |
          test -n "$GH_TOKEN" || { echo "::error::secret DATA_REPO_TOKEN is missing"; exit 1; }
          mkdir -p data
          tag=$(gh release list --repo "$DATA_REPO" --limit 1 --json tagName --jq '.[0].tagName')
          test -n "$tag" || { echo "::error::no snapshot release in $DATA_REPO to start from"; exit 1; }
          gh release download "$tag" --repo "$DATA_REPO" --pattern crawl.db.zst --dir data
          zstd -d -q data/crawl.db.zst -o data/crawl.db && rm data/crawl.db.zst
          echo "starting from $tag ($(du -h data/crawl.db | cut -f1))"

      - name: Crawl
        run: |
          args=(crawl run --db data/crawl.db --quiet --concurrency 16 --output data/report.md)
          if [ -n "$IN_LIMIT" ]; then args+=(--limit "$IN_LIMIT"); fi
          if [ "$IN_FULL_SYNC" = "true" ]; then args+=(--full-sync); fi
          .venv/bin/sniffmcp "${args[@]}"

      - name: Health
        if: always() && steps.fetch.outcome == 'success'
        run: .venv/bin/sniffmcp crawl status --db data/crawl.db | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save snapshot (private repo)
        # also after a partial failure: whatever was collected must not be lost
        if: always() && steps.fetch.outcome == 'success'
        run: |
          zstd -q -10 -T0 data/crawl.db -o crawl.db.zst
          files=(crawl.db.zst)
          if [ -f data/report.md ]; then files+=(data/report.md); fi
          tag="crawl-$(date -u +%F)-run${GITHUB_RUN_ID}"
          gh release create "$tag" --repo "$DATA_REPO" --title "$tag" \
            --notes "Automated crawl snapshot (run ${GITHUB_RUN_ID})." "${files[@]}"
          echo "saved $tag ($(du -h crawl.db.zst | cut -f1))"
          # keep the newest 14 snapshots (the database itself carries the full history)
          gh release list --repo "$DATA_REPO" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[14:][] | .tagName' \
            | xargs -r -n1 gh release delete --repo "$DATA_REPO" --yes --cleanup-tag
